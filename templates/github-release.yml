##
## This optional GitHub Actions workflow releases the project.
##
## To use it, copy this file to .github/workflows/release.yml in your project.
## This file is a template. GitHub does not run it from this repository.
##
## The workflow starts when you push a version tag such as v1.2.3. You can also start it from
## the Actions tab. A tag run publishes the tag that started the workflow. A manual branch
## run lets the release command create the tag. Both ways build, test, and publish.
##
## The workflow installs commandbox-release on the GitHub runner. It runs the same release
## command you can run on your computer.
##
## Add FORGEBOX_API_TOKEN to your repository secrets when you publish to ForgeBox.
## Get the token from https://forgebox.io. GitHub provides GITHUB_TOKEN automatically.
##
## The workflow uses the Actions run number as the build ID. For example, run 7 marks the
## package as 1.2.3+7. Remove buildID from the release command to use the Git commit hash.
##

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out the source code
        uses: actions/checkout@v4
        with:
          # Download all tags so the release check can find versions that already exist.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install CommandBox
        uses: Ortus-Solutions/setup-commandbox@v2.0.1

      - name: Install dependencies
        run: |
          box install
          box install commandbox-release@^3.0.0

      - name: Start the test server
        run: |
          box server start serverConfigFile=server-lucee@5.json --!console
          # Wait until the app answers before running the tests.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:60299/ || true)
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then echo "server is up"; break; fi
            sleep 5
          done

      - name: Sign in to ForgeBox
        if: env.FORGEBOX_API_TOKEN != ''
        env:
          FORGEBOX_API_TOKEN: ${{ secrets.FORGEBOX_API_TOKEN }}
        run: box forgebox set-api-token "$FORGEBOX_API_TOKEN"

      - name: Build and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Use the existing tag for a tag run. Create a tag for a manual branch run.
        run: box release publish buildID=${{ github.run_number }}
